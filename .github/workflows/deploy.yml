name: CI/CD - Pruebas y release

# Nota sobre el despliegue:
# Este workflow NO despliega al homelab. Los runners de GitHub corren en la nube
# y no tienen ruta hacia una red local de casa, así que un push por SSH a
# homelab.local nunca iba a funcionar (y fallaba en cada ejecución).
# El despliegue se hace con `scripts/deploy.sh`, que corre desde tu equipo.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/elitedriver-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/elitedriver-frontend

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run backend tests
        working-directory: apps/EliteDriverBackendSoft
        run: ./mvnw -B test

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/EliteDriverFrontEndSoft/package-lock.json

      - name: Install dependencies
        working-directory: apps/EliteDriverFrontEndSoft
        run: npm ci

      - name: Run frontend tests
        working-directory: apps/EliteDriverFrontEndSoft
        run: npm test

      - name: Build frontend
        working-directory: apps/EliteDriverFrontEndSoft
        run: npm run build

  build-and-push:
    name: Build & Push Images
    # Solo en tags: cada push a main dispara las pruebas, que es lo que
    # interesa ver rápido. Las imágenes se publican al liberar una versión.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/EliteDriverBackendSoft
          file: ./apps/EliteDriverBackendSoft/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/EliteDriverFrontEndSoft
          file: ./apps/EliteDriverFrontEndSoft/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_APP_VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Output version
        run: |
          echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "Deployed version: ${{ github.ref_name }}"

  resumen:
    name: Como desplegar
    needs: [test-backend, test-frontend]
    if: always() && needs.test-backend.result == 'success' && needs.test-frontend.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Instrucciones de despliegue
        run: |
          echo "### Pruebas correctas." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "El despliegue al homelab **no** lo hace este workflow." >> $GITHUB_STEP_SUMMARY
          echo "Los runners de GitHub estan en la nube y no llegan a una red local de casa," >> $GITHUB_STEP_SUMMARY
          echo "por eso el deploy por SSH a \\`homelab.local\\` no puede funcionar." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Para publicar en el servidor, desde tu equipo:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "./scripts/deploy.sh ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Verifica despues en el panel de administracion, en la esquina inferior" >> $GITHUB_STEP_SUMMARY
          echo "izquierda aparece la version desplegada." >> $GITHUB_STEP_SUMMARY
