limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

# Caché 60s para catálogo y disponibilidad (datos poco cambiantes)
proxy_cache_path /var/cache/nginx/catalog levels=1:2 keys_zone=catalog:10m max_size=100m inactive=5m use_temp_path=off;

server {
    listen 80;
    server_name _;
    server_tokens off;
    underscores_in_headers on;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión: menos peso = más rápido en móvil
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_vary on;

    # Límites anti-DoS (webhook Wompi es byte[] sin límite en Spring)
    client_max_body_size 100k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # Headers seguridad (Cloudflare Tunnel termina TLS delante, esto suma defensa)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'" always;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Login/register: 5 intentos/min por IP
    location /api/auth/ {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://backend:8080/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/payments/wompi/webhook {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://backend:8080/api/payments/wompi/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # GETs públicos se cachean 60s, resto pasa directo
        proxy_cache catalog;
        proxy_cache_methods GET;
        proxy_cache_valid 200 60s;
        proxy_cache_valid 404 10s;
        proxy_cache_bypass $http_authorization $arg_nocache;
        proxy_no_cache $http_authorization;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Assets con hash: 1 año. index.html nunca se cachea.
    location ~* \.(js|css|png|jpg|jpeg|webp|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
